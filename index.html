<style>
:root{--g:#0f7b5f;--gd:#0a5a45;--o:#f08a24;--bg:#f4f8f5;--r:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#1c2b26}

.btn{background:var(--o);color:#fff;padding:13px;font-weight:700;width:100%;margin-top:8px}.btn.sec{background:#e3ece7;color:var(--gd)}

.q{font-size:1.5rem;margin:10px 0}
.opt{color:#1c2b26;display:block;width:100%;background:#f1f6f3;border:2px solid transparent;padding:10px 14px;margin-top:10px;font-size:1.3rem}
.opt:hover:not(:disabled){border-color:var(--g)}.opt.ok{background:#d5f2e3;border-color:var(--g)}.opt.no{background:#fbdcdc;border-color:var(--r)}
.bar{height:8px;background:#dde8e2;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--o);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:#5a6e65}
.exp{background:#fff7e8;border-left:4px solid var(--o);padding:10px 12px;margin-top:12px;border-radius:8px;font-size:.92rem}
.warn{background:#fff0c9;color:#7a5200;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:.85rem}
.big{font-size:3rem;font-weight:800;color:var(--g);text-align:center}
select{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #cfe0d8;margin-top:6px}
label{font-weight:600;font-size:.9rem;display:block;margin-top:12px}.hide{display:none}.center{text-align:center}.note{font-size:.8rem;color:#5a6e65;margin-top:14px}
</style></head><body>
<header><h1>Kuiz UPKK · Sirah</h1><p>Pilot · 100 Soalan Sirah Menjelang UPKK (Ustazah Noor Azizah Serajudin)</p></header>
<main>
<div id="home" class="card">
 <div class="center" id="best"></div>

 <label>Susunan<select id="ord"><option value="r">Rawak</option><option value="s">Ikut nombor soalan</option></select></label>
 <button class="btn" onclick="start()">Mula Kuiz</button>
 <button class="btn sec" id="wbtn" onclick="startWrong()"></button>
 <p class="note">Soalan diambil daripada bahan ustazah dan digunakan untuk latihan peribadi. Soalan bertanda ⚠ mempunyai jawapan yang belum disahkan oleh guru atau skema.</p>
</div>
<div id="play" class="card hide">
 <div class="meta"><span id="no"></span><span id="sc"></span></div>
 <div class="bar"><i id="pg"></i></div>
 <div class="meta"><span id="top"></span></div>
 <div class="q jawi" id="q"></div><div id="opts"></div>
 <div class="exp hide" id="exp"></div>
 <button class="btn hide" id="nx" onclick="next()">Seterusnya</button>
</div>
<div id="end" class="card hide center">
 <div class="big" id="fs"></div><p id="fm"></p>
 <button class="btn" onclick="start(true)">Main Semula</button>
 <button class="btn sec" onclick="startWrong()">Ulang yang salah</button>
 <button class="btn sec" onclick="home()">Menu Utama</button>
</div>
</main>

": ["بلال بن رباح", "سلمان الفارسي"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 36, "bahagian": "Bahagian C · Pilih jawapan", "soalan": "ڤڤرڠن خندق برلاکو ڤد بولن ____________.", "pilihan": ["رمضان", "شوال", "ذوالقعدة"], "jawapan": 1, "sah": false, "nota": "Ada riwayat Syawal dan Zulkaedah."}, {"no": 37, "bahagian": "Bahagian C · Pilih jawapan", "soalan": "دالم ڤڤرڠن احزب تنترا مشرکين دکتواءي اوليه ____________.", "pilihan": ["ابو جهل", "ابو طالب", "ابو سفيان"], "jawapan": 2, "sah": true, "nota": ""}, {"no": 38, "bahagian": "Bahagian C · Pilih jawapan", "soalan": "چادڠن مڠݢالي ڤاريت دسکليليڠ کوتا مدينة تله دچادڠکن اوليه ____________.", "pilihan": ["سلمان الفارسي", "أبو بكر", "عبدالله"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 39, "bahagian": "Bahagian C · Pilih jawapan", "soalan": "رسول الله ﷺ تله ممنتکن ڤاسوقن ____________ دأتس بوکيت.", "pilihan": ["ڤمانه", "برکودا", "ڤريساي"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 40, "bahagian": "Bahagian C · Pilih jawapan", "soalan": "کتوا اورڠ منافق يڠ مڠهاسوت تنترا إسلام اکر تيدق ڤرݢي برڤرڠ اياله ____________.", "pilihan": ["أُبَي بن خَلَف", "زُبَير بن العوام", "عبدالله بن أُبَي"], "jawapan": 2, "sah": true, "nota": ""}, {"no": 41, "bahagian": "Bahagian C · Betul / Salah", "soalan": "وحي ڤرتام دتورونکن د ݢوا حراء.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 42, "bahagian": "Bahagian C · Betul / Salah", "soalan": "ميسرة اياله ڤمبنتو لاليک سيدتنا خديجة.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 43, "bahagian": "Bahagian C · Betul / Salah", "soalan": "القرءان دتورونکن برانسور-انسور سلام 10 تاهون.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": "Al-Quran diturunkan sepanjang 23 tahun."}, {"no": 44, "bahagian": "Bahagian C · Betul / Salah", "soalan": "راج النجاشي اداله سأورڠ راج يڠ عاديل.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 45, "bahagian": "Bahagian C · Betul / Salah", "soalan": "تنترا احزاب دکتواءي اوليه ابو جهل.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": "Dipimpin Abu Sufyan."}, {"no": 46, "bahagian": "Bahagian C · Betul / Salah", "soalan": "ڤرڠ خندق جوݢ دکنلي سباݢاي ڤرڠ احزاب.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 47, "bahagian": "Bahagian C · Betul / Salah", "soalan": "تنترا احزاب ملاکوکن کڤوڠن سلام 15 هاري.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": "Pengepungan kira-kira sebulan."}, {"no": 48, "bahagian": "Bahagian C · Betul / Salah", "soalan": "ڤرملباݢاءن برتوليس يڠ ڤرتام ددنيا اداله ڤياݢم مدينة.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": false, "nota": "Piagam Madinah."}, {"no": 49, "bahagian": "Bahagian C · Betul / Salah", "soalan": "تنترا إسلام يڠ شهيد دالم ڤڤرڠن بدر سراماي 50 اورڠ.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": "Syahid di Badr seramai 14 orang."}, {"no": 50, "bahagian": "Bahagian C · Betul / Salah", "soalan": "سراماي 14 اورڠ تنترا مشرکين يڠ دتاون دالم ڤرڠ بدر.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": ""}, {"no": 51, "bahagian": "Bahagian C · Betul / Salah", "soalan": "نبي محمد ﷺ بربرمناجات د ݢوا حراء.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 52, "bahagian": "Bahagian C · Betul / Salah", "soalan": "وحي اياله کلام ملائکة يڠ دسمڤايکن کڤد ڤارا نبي.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": "Wahyu ialah kalam Allah."}, {"no": 53, "bahagian": "Bahagian C · Betul / Salah", "soalan": "ڤرڠ بدر برلاکو دلمبه بدر يڠ ترلتق دأنتارا مکة دان مدينة.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 0, "sah": true, "nota": ""}, {"no": 54, "bahagian": "Bahagian C · Betul / Salah", "soalan": "ايسي ڤرجنجين حديبية دتوليس اوليه عثمان بن عفان.", "pilihan": ["✓ Betul", "✗ Salah"], "jawapan": 1, "sah": false, "nota": "Ditulis oleh Ali bin Abi Talib."}];const $=id=>document.getElementById(id);
const K='upkk_sirah_pilot';let S=JSON.parse(localStorage.getItem(K)||'{"best":0,"wrong":[]}');
let Q=[],i=0,sc=0,last={};
[...new Set(D.map(d=>d.bahagian))].forEach(t=>$('bh').add(new Option(t,t)));
function shuf(a){a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a}
function show(x){['home','play','end'].forEach(s=>$(s).classList.toggle('hide',s!=x))}
function home(){show('home');$('best').innerHTML=S.best?'<p>Skor terbaik: <b>'+S.best+'%</b></p>':'';
 $('wbtn').textContent='Ulang soalan yang pernah salah ('+S.wrong.length+')';$('wbtn').classList.toggle('hide',!S.wrong.length)}
function start(again){const b=again?last.b:$('bh').value,o=again?last.o:$('ord').value;last={b,o};
 let p=b?D.filter(d=>d.bahagian==b):D;run(o=='r'?shuf(p):p)}
function startWrong(){const p=D.filter(d=>S.wrong.includes(d.no));if(p.length)run(shuf(p))}
function run(a){Q=a;i=0;sc=0;show('play');render()}
function render(){const d=Q[i];$('no').textContent='Soalan '+(i+1)+' / '+Q.length;$('sc').textContent='Skor: '+sc;
 $('pg').style.width=(i/Q.length*100)+'%';$('top').textContent='No. '+d.no+' · '+d.bahagian+(d.sah?'':' · ⚠');$('q').textContent=d.soalan;
 $('opts').innerHTML='';d.pilihan.forEach((t,k)=>{const b=document.createElement('button');b.className='opt jawi';
  b.textContent=(d.pilihan.length>2&&d.pilihan!==undefined&&!/^[✓✗]/.test(t)?['أ','ب','ج','د'][k]+'  ':'')+t;b.onclick=()=>pick(k,b);b.dataset.k=k;$('opts').appendChild(b)});
 $('exp').classList.add('hide');$('nx').classList.add('hide')}
function pick(k,b){const d=Q[i];document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.k==d.jawapan)o.classList.add('ok')});
 const ok=k==d.jawapan;if(ok){sc++;S.wrong=S.wrong.filter(e=>e!=d.no)}else{b.classList.add('no');if(!S.wrong.includes(d.no))S.wrong.push(d.no)}
 $('sc').textContent='Skor: '+sc;
 $('exp').innerHTML='<b>'+(ok?'✅ Betul!':'❌ Salah')+'</b>'+(d.nota?'<br>'+d.nota:'')+(d.sah?'':'<div class="warn">⚠ Jawapan ini dijana PA dan belum disahkan oleh guru/skema.</div>');
 $('exp').classList.remove('hide');$('nx').textContent=i+1<Q.length?'Seterusnya':'Lihat Keputusan';$('nx').classList.remove('hide');
 localStorage.setItem(K,JSON.stringify(S))}
function next(){if(++i<Q.length)return render();const p=Math.round(sc/Q.length*100);if(p>S.best&&Q.length>=10)S.best=p;
 localStorage.setItem(K,JSON.stringify(S));show('end');$('fs').textContent=sc+' / '+Q.length;
 $('fm').textContent=p>=80?'MasyaAllah, cemerlang! ('+p+'%)':p>=50?'Bagus, teruskan belajar! ('+p+'%)':'Jangan putus asa, cuba lagi! ('+p+'%)'}
